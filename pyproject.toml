# Workspace root. Also the `noa-core` package: shared code lives in `core/`
# — one shared core, one Alembic, three deploy artifacts.
[project]
name = "noa-core"
version = "0.1.0"
description = "NOA shared core — config, auth, remote_exec, secrets, integrations"
# Upper bound: pgpy 0.6.0 (last release) imports stdlib `imghdr` at import
# time; removed in 3.13. On 3.13+ that crashes tool-registry import, not only the
# password-reset path. Hold <3.13 until pgpy ships a 3.13-compatible release.
requires-python = ">=3.11,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
noa-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One async driver, and it is pytest-asyncio. `anyio` arrives as a transitive dependency of
# starlette/httpx and its pytest plugin registers itself, so with both loaded an async fixture is
# claimed by whichever of the two `pytest_fixture_setup` wrappers pluggy happens to run
# outermost — and neither declares `tryfirst`, so that order comes from plugin registration order,
# which is environment-dependent. When the two split a test — fixture driven by one plugin, test
# body by the other — they run on two different event loops, and a database connection opened in
# the test body then cannot be closed in fixture teardown: asyncpg raises "got Future attached to a
# different loop", the connection leaks, and the scratch-database DROP fails with ObjectInUseError.
# That is not theoretical: it is what turned the GitLab `test:python` job red while the same tree
# stayed green locally. Disabling the plugin makes the choice structural rather than incidental, so
# a future `@pytest.mark.anyio` cannot quietly hand one file to the other driver.
addopts = "-p no:anyio"
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "apps/admin-web", "apps/web-embed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert OK in tests

[tool.ruff.lint.per-file-ignores]
# S105/S106: hardcoded token & password literals are fixtures in tests.
"**/tests/**" = ["S105", "S106"]
# E501: the fixtures are verbatim `csf -g` output. Its iptables table lines are 108 columns
# wide on a real box; reflowing them to fit would make the parser test assert against text
# CSF never produces.
"**/tests/test_whm_csf_parsing.py" = ["S105", "S106", "E501"]

[tool.ruff.lint.isort]
# `support` = `apps/api/tests/support`, importable because pytest puts the tests
# directory on `sys.path`. Listed so isort groups it with our code, not third-party.
known-first-party = ["core", "noa_api", "support"]
