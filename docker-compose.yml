# NOA local development stack.
#
#   docker compose up -d postgres          # Postgres only — what README and AGENTS.md tell you
#   docker compose --profile apps up -d    # the whole stack: Postgres, migrations, all three apps
#
# Only `postgres` is profile-free, so the first command builds no images. That is deliberate:
# the documented development loop runs the API from a checkout (`uv run uvicorn`) against a
# containerised database, and `apps/admin-web` cannot even be built outside the Biznet Gio
# network (its `@gio/*` registry is internal-only). Making the whole stack the default would
# mean the documented one-liner fails for a reason that has nothing to do with what it asks for.
#
# Configuration comes from the repo-root `.env` and nowhere else — the rule
# `apps/*/config/root-env.ts` already states: two env files for one deployment is two places for
# `NOA_API_URL` to disagree, and a proxy quietly talking to the wrong API is not a failure
# anyone sees. Every service below therefore overrides ONLY the values the container network
# forces (a service name instead of `localhost`), and reads the rest from `.env`.
#
# Browsing this stack at `*.noa.internal` rather than `localhost` is not cosmetic: the
# `noa_session` cookie is scoped `Domain=.noa.internal`, so it does not ride to
# `localhost` at all and every sign-in appears to succeed and then do nothing. The hosts line
# and the three `.env` values are in `docs/deployment.md`.

name: noa

services:
  # Postgres 16. The one service with no profile, so `docker compose up -d postgres` works
  # in a fresh clone with nothing built.
  #
  # Credentials are the throwaway pair `.env.example`'s `POSTGRES_URL` already carries. They are
  # development-only by construction: the port is published on the loopback interface, so
  # nothing off this host can reach the database regardless of what the password is.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noa
      POSTGRES_PASSWORD: noa
      POSTGRES_DB: noa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - noa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` and not a `SELECT`: this gates `migrate` below, and a readiness gate that
      # runs a query of its own is a second definition of "ready" to keep in step.
      test: ["CMD-SHELL", "pg_isready -U noa -d noa"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One Alembic history for the whole monorepo. Runs to completion and exits; `api` waits
  # for that exit rather than running migrations itself, so a failed migration stops the stack
  # with the migration's own error instead of a web server that answers 500 on every route.
  migrate:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app/apps/api
    command: ["alembic", "upgrade", "head"]
    env_file:
      # `required: false` so `docker compose config` and `up -d postgres` still work before
      # anyone has run `cp .env.example .env`.
      - path: .env
        required: false
    environment:
      POSTGRES_URL: postgresql+asyncpg://noa:noa@postgres:5432/noa
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["apps"]
    build:
      # Repo root, because `noa-api` is a uv workspace member and `noa-core` is the workspace
      # root — see `apps/api/Dockerfile`.
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # The only override: inside the network the database answers at the service name.
      POSTGRES_URL: postgresql+asyncpg://noa:noa@postgres:5432/noa
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One replica, no `deploy.replicas`, no `--workers` in the image. The zero-clock-leeway rule
  # pins session-JWT verification to zero clock leeway because mint and verify share a clock; the
  # approved-change executor and reaper, the expiry sweep and the list-changed notification
  # register are all in-process. Scaling out is a deliberate change with that rule's revisit
  # trigger attached — see `docs/deployment.md`.

  admin-web:
    profiles: ["apps"]
    # This app's own directory, never the repo root: the two web packages are separate deploy
    # artifacts that share no source, and a repo-root context would put each one's files
    # inside the other's image.
    build:
      context: apps/admin-web
    environment:
      # Named individually rather than via `env_file`, unlike the API above. This container
      # reads exactly one variable, and handing it the Fernet key, the JWT secret and the LDAP
      # bind password as well would put three credentials somewhere nothing reads them.
      NOA_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  embed:
    profiles: ["apps"]
    build:
      context: apps/web-embed
      args:
        # BUILD time, not runtime, and this is the only place the value can enter (the
        # frame-ancestors rule):
        # `output: 'standalone'` bakes `frame-ancestors` into the compiled output, so the same
        # key under `environment:` below would be a setting that looks like it moves this and
        # does not. Unset or blank leaves the pinned `https://chat.noa.internal` in place, so
        # the header is never omitted by a variable nobody passed.
        NOA_LIBRECHAT_ORIGIN: ${NOA_LIBRECHAT_ORIGIN:-}
    environment:
      NOA_API_URL: http://api:8000
      # Where the 401 card sends an operator. Read at request time, so unlike the
      # framing origin it belongs here. Blank is a valid answer: the card then names the state
      # and offers no link, which beats a door to a host nobody deployed.
      NOA_SIGN_IN_URL: ${NOA_SIGN_IN_URL:-}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  noa-postgres-data:
